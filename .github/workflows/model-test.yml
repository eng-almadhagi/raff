name: Optional local model verification
on: workflow_dispatch
permissions:
  contents: read
jobs:
  semantic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-semantic.txt
      - run: python -m tools.setup_model
      - run: python -m unittest discover -v
        env:
          RAF_RUN_MODEL_TESTS: '1'
      - run: python -m tools.benchmark
        env:
          RAF_EMBED_BACKEND: local
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-semantic-results
          path: var/semantic-benchmark-result.json
