<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      name="description"
      content="رَفّ — وصول إلى الفتوى في مصدرها، ببحث دلالي ونصوص موثقة."
    />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self'; img-src 'self'; style-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'"
    />
    <title>رَفّ | من السؤال إلى المصدر</title>
    <link rel="icon" href="./logo.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./style.css?v=0.12.0" />
  </head>
  <body>
    <header>
      <a class="brand" href="./"
        ><img src="./logo.svg" alt="Raff" width="52" height="52" /><span
          id="brand-name"
          >رَفّ</span
        ></a
      >
      <nav aria-label="Navigation">
        <button id="home" data-i18n="home">اسأل رَفّ</button
        ><button id="about" data-i18n="about">عن المشروع</button
        ><button id="method" data-i18n="method">المنهجية والمصادر</button>
        <button id="library-nav">مكتبتي</button>
      </nav>
      <div class="header-tools">
        <div
          id="language"
          class="choices"
          role="group"
          aria-label="Language / اللغة"
        >
          <button
            type="button"
            data-language="ar"
            lang="ar"
            aria-pressed="true"
          >
            العربية
          </button>
          <button
            type="button"
            data-language="en"
            lang="en"
            aria-pressed="false"
          >
            English
          </button>
        </div>
        <button id="theme" type="button" aria-label="تبديل المظهر">◐</button>
      </div>
    </header>
    <main hidden>
      <section id="intro" class="hero">
        <span class="eyebrow" data-i18n="eyebrow"></span>
        <h1>
          <span data-i18n="heading"></span><br /><em data-i18n="heading2"></em>
        </h1>
        <p data-i18n="intro"></p>
        <div class="facts" id="facts"></div>
      </section>
      <section id="search-panel" class="search-panel" aria-label="Search">
        <div id="library-scope"></div>
        <span id="scope-label" class="field-label" data-i18n="scope"></span>
        <div
          id="book"
          class="choices source-choices"
          role="group"
          aria-labelledby="scope-label"
        ></div>
        <form id="ask-form">
          <label for="question" data-i18n="label"></label
          ><textarea id="question" maxlength="600" rows="3" required></textarea>
          <div class="form-footer">
            <button id="reset" type="button" data-i18n="newSession"></button
            ><button
              id="submit"
              type="submit"
              disabled
              data-i18n="search"
            ></button>
          </div>
        </form>
        <div class="search-status" role="status" aria-live="polite">
          <span
            id="search-indicator"
            class="search-spinner"
            aria-hidden="true"
            hidden
          ></span>
          <p id="status"></p>
        </div>
        <p id="status-detail" class="search-detail"></p>
        <p id="search-metrics" class="search-detail" hidden></p>
        <button
          id="retry-search"
          type="button"
          data-i18n="retry"
          hidden
        ></button>
      </section>
      <div id="starter" class="topics"></div>
      <section id="result" aria-live="polite"></section>
      <section id="about-panel" class="card" hidden>
        <h2 data-i18n="about"></h2>
        <p data-i18n="aboutText"></p>
      </section>
      <section id="library-panel" class="card" hidden></section>
      <section id="method-panel" class="card" hidden>
        <h2 data-i18n="method"></h2>
        <div id="method-content"></div>
      </section>
      <aside id="release-note" class="release-note"></aside>
    </main>
    <footer>
      <span>Raff · رَفّ</span>
      <p data-i18n="footer"></p>
    </footer>
    <script type="module" src="./app.mjs?v=0.12.0"></script>
  </body>
</html>
